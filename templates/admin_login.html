<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | Aloha</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f6f4ef;
            color: #252525;
            font-family: Arial, sans-serif;
        }
        .login {
            width: 100%;
            max-width: 410px;
            padding: 30px;
            border-radius: 18px;
            background: white;
            box-shadow: 0 8px 30px #00000012;
        }
        .brand { color: #c77b16; font-weight: bold; letter-spacing: 2px; }
        h1 { margin-bottom: 8px; }
        p { color: #666; line-height: 1.5; }
        label { display: block; margin: 18px 0 7px; font-weight: bold; }
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 16px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #c77b16;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            background: #fff0ed;
            color: #9b2c1b;
        }
    </style>
</head>
<body>
    <main class="login">
        <div class="brand">ALOHA</div>
        <h1>Panel de administración</h1>
        <p>Inicia sesión para gestionar los productos de tu carta.</p>

        {% for categoria, mensaje in get_flashed_messages(with_categories=true) %}
            <div class="message">{{ mensaje }}</div>
        {% endfor %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="usuario">Usuario</label>
            <input id="usuario" name="usuario" autocomplete="username" required>

            <label for="contrasena">Contraseña</label>
            <input id="contrasena" name="contrasena"
                   type="password" autocomplete="current-password" required>

            <button type="submit">Entrar al panel</button>
        </form>
    </main>
</body>
</html>
